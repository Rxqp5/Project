# Publishes the app to GitHub Pages: on every push to main, and once a day so the
# game data (new bosses, Megas, moves) stays fresh. The raid rotation itself is
# fetched live by the app, so it doesn't need a rebuild.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh game data
        # If a source is down or the fresh data fails the tests, publish the committed copy instead.
        run: |
          if npm run build:data && npm test; then
            echo "Using freshly built data"
          else
            echo "::warning::Fresh data build failed; publishing the committed data"
            git checkout -- data/game.json
            npm test
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html icon.svg manifest.webmanifest sw.js src data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
